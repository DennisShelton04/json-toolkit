name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit + UI tests with coverage gate (≥80% core)
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: dist
          path: dist

  docker:
    # Docker isn't available on all dev machines, so the image is built and smoke-tested here.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t json-toolkit:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 json-toolkit:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done

          check() { # usage: check <description> <url> <grep-pattern>
            if curl -fsSI "$2" | tr -d '\r' | grep -qiE "$3"; then echo "PASS  $1"; else echo "FAIL  $1"; curl -sSI "$2" | cat -v; exit 1; fi
          }
          check "security headers on /"        http://localhost:8080/            '^x-content-type-options: nosniff'
          check "index.html is not cached"     http://localhost:8080/            '^cache-control: no-cache'
          asset=$(curl -fs http://localhost:8080/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          check "hashed assets are immutable"  "http://localhost:8080/$asset"    '^cache-control: .*immutable'
          check "security headers on assets"   "http://localhost:8080/$asset"    '^x-frame-options: deny'
          curl -fs http://localhost:8080/some/deep/link | grep -q '<title>JSON Toolkit</title>' && echo "PASS  SPA fallback"
      - if: failure()
        name: Diagnostics
        run: |
          docker exec app nginx -T || true
          docker logs app || true
