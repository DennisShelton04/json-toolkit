name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit + UI tests with coverage gate (≥80% core)
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: dist
          path: dist

  docker:
    # Docker isn't available on all dev machines, so the image is built and smoke-tested here.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t json-toolkit:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 json-toolkit:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsI http://localhost:8080/ | tee headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          curl -fs http://localhost:8080/ | grep -q '<title>JSON Toolkit</title>'
          asset=$(curl -fs http://localhost:8080/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -fsI "http://localhost:8080/$asset" | grep -qi 'immutable'
          curl -fs http://localhost:8080/some/deep/link | grep -q '<title>JSON Toolkit</title>'
      - if: always()
        run: docker logs app || true
